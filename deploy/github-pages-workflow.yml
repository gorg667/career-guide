# Deploys the pre-built static site in docs/ to GitHub Pages.
# docs/ is committed (generated by `python3 site/build_site.py`), so no build step is needed here.
# `enablement: true` asks the Actions token to turn Pages on for the repo if it is not yet enabled.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify the committed site is current
        run: |
          pip install -q markdown pymdown-extensions
          python3 site/build_site.py
          git diff --stat -- docs/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
